---
# ZBSpec configuration (created by zbspec --init)
startup_timeout: 120
auto_shutdown: false
game_path: /Applications/Project Zomboid.app
game_versions_root: "~/projects/zomboid/versions"
game_versions:
  - default
debug: true
spec_glob: spec/**/*_spec.lua
# Required mods (ZombieBuddy, ZBSpec, and the mod under test are always included).
# Mod id is case-sensitive (must match the id= in the mod's mod.info).
mods:
  - YourModName
