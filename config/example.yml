---
# Example ZBSpec configuration
# Copy to your mod's spec/zbspec.yml (or run: zbspec --init)

startup_timeout: 120
auto_shutdown: false
game_path: /Applications/Project Zomboid.app
game_versions_root: "~/projects/zomboid/versions"
game_versions:
  - 41
  - 42.12
  - 42.13
  - unstable
debug: true
spec_glob: spec/**/*_spec.lua

# Your mod(s) to test (ZombieBuddy and ZBSpec are auto-included)
mods:
  - YourModName

# Optional: multiplayer (for --mp and --client)
# server_name: ZBSpecServer
# server_ip: 127.0.0.1
# server_port: 16261
# username: ZBSpecPlayer
# password: ""
