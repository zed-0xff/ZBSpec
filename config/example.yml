---
# Example ZBTest configuration
# Copy to your mod's tests/framework/config.yml

# ZombieBuddy API port (will use random port automatically)
api_port: 4445

# Seconds to wait for game startup
startup_timeout: 120

# Stop game after tests complete
auto_shutdown: false

# Use already-running game instead of launching (default: false)
use_running_game: false

# Path to Project Zomboid (for auto-launch)
game_path: /Applications/Project Zomboid.app

# Launch as server
server_mode: false

# Enable debug mode
debug: true

# Test file discovery pattern (glob)
test_glob: test/**/*_test.lua

# Your mod(s) to test
# Note: ZombieBuddy and ZBTest are automatically included
mods:
  - YourModName
