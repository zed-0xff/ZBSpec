# Example ZBSpec configuration (YAML format)

# API settings (will use random port automatically)
api_port: 4445
startup_timeout: 120

# Game control
use_running_game: false   # Launch game automatically (default: false)
auto_shutdown: false      # Don't stop game after specs

# Game launch settings (if use_running_game: false)
game_path: /Applications/Project Zomboid.app
server_mode: false
debug: true

# Spec file discovery pattern (glob)
spec_glob: spec/**/*_spec.lua

# Mods to load
# Note: ZombieBuddy and ZBSpec are automatically included
mods:
  - YourModName

# Optional settings
# test_world: TestWorld
# spawn_location:
#   x: 12345
#   y: 6789
#   z: 0
