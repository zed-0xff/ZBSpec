# Example ZBTest configuration (YAML format)

# API settings
api_port: 4445
startup_timeout: 120

# Game control
use_running_game: true    # Use already-running game
auto_shutdown: false      # Don't stop game after tests

# Game launch settings (if use_running_game: false)
game_path: /Applications/Project Zomboid.app
server_mode: false
debug: true

# Mods to load
mods:
  - YourModName
  - ZombieBuddy  # Required for API

# Optional settings
# test_world: TestWorld
# spawn_location:
#   x: 12345
#   y: 6789
#   z: 0
